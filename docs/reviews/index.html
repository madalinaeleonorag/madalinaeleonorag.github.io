      successfully applied to our project. Although the complexity of the project is high, Madalina
      integrated well into the team and started delivering soon after joining the project. She proved she
      was a great team player.</blockquote><figcaption _ngcontent-ng-c203791225 class="author full-width"><strong _ngcontent-ng-c203791225>Tech Lead</strong><span _ngcontent-ng-c203791225 class="author-details"><span _ngcontent-ng-c203791225>Senior Frontend Developer</span><!----><span _ngcontent-ng-c203791225 aria-hidden="true">@</span><!----><span _ngcontent-ng-c203791225 class="company-info"><app-svg-icon _ngcontent-ng-c203791225 class="company-logo" _nghost-ng-c238518654 ngh="0"><img _ngcontent-ng-c238518654 alt loading="lazy" decoding="async" src="/assets/logos/ssc.svg"><!----><!----></app-svg-icon><span _ngcontent-ng-c203791225>SS&amp;C Technologies</span></span><!----><time _ngcontent-ng-c203791225 datetime="2026-02-01T00:00:00.000Z">(Feb 2026)</time><!----></span></figcaption></figure></app-review-card><app-review-card _ngcontent-ng-c782549083 _nghost-ng-c203791225 ngh="1"><figure _ngcontent-ng-c203791225 class="review-card"><blockquote _ngcontent-ng-c203791225 class="quote-full">Madalina proved to be a highly reliable and skilled front-end developer. She can independently
      take over and deliver complex features; she constantly pays attention to details and is always
      making sure all the acceptance criteria are met. Her positive attitude and excellent communication
      skills made her a great addition to the team.</blockquote><figcaption _ngcontent-ng-c203791225 class="author full-width"><strong _ngcontent-ng-c203791225>Tech Lead</strong><span _ngcontent-ng-c203791225 class="author-details"><span _ngcontent-ng-c203791225>Tech Lead</span><!----><span _ngcontent-ng-c203791225 aria-hidden="true">@</span><!----><span _ngcontent-ng-c203791225 class="company-info"><app-svg-icon _ngcontent-ng-c203791225 class="company-logo" _nghost-ng-c238518654 ngh="0"><img _ngcontent-ng-c238518654 alt loading="lazy" decoding="async" src="/assets/logos/ssc.svg"><!----><!----></app-svg-icon><span _ngcontent-ng-c203791225>SS&amp;C Technologies</span></span><!----><time _ngcontent-ng-c203791225 datetime="2026-02-01T00:00:00.000Z">(Feb 2026)</time><!----></span></figcaption></figure></app-review-card><app-review-card _ngcontent-ng-c782549083 _nghost-ng-c203791225 ngh="1"><figure _ngcontent-ng-c203791225 class="review-card"><blockquote _ngcontent-ng-c203791225 class="quote-full">Madalina is a hard-working individual, highly motivated and organized. She has very good
      technical skills and is eager to learn and try new things. From the soft skills point of view, she
      communicates very well and proved to be a great team player.</blockquote><figcaption _ngcontent-ng-c203791225 class="author full-width"><strong _ngcontent-ng-c203791225>Tech Lead</strong><span _ngcontent-ng-c203791225 class="author-details"><span _ngcontent-ng-c203791225>Tech Lead</span><!----><span _ngcontent-ng-c203791225 aria-hidden="true">@</span><!----><span _ngcontent-ng-c203791225 class="company-info"><app-svg-icon _ngcontent-ng-c203791225 class="company-logo" _nghost-ng-c238518654 ngh="0"><img _ngcontent-ng-c238518654 alt loading="lazy" decoding="async" src="/assets/logos/ssc.svg"><!----><!----></app-svg-icon><span _ngcontent-ng-c203791225>SS&amp;C Technologies</span></span><!----><time _ngcontent-ng-c203791225 datetime="2026-02-01T00:00:00.000Z">(Feb 2026)</time><!----></span></figcaption></figure></app-review-card><app-review-card _ngcontent-ng-c782549083 _nghost-ng-c203791225 ngh="1"><figure _ngcontent-ng-c203791225 class="review-card"><blockquote _ngcontent-ng-c203791225 class="quote-full">From the short period of time I worked with her, she is very good from a technical perspective.
      Proactive, good coding style, understand quickly the logic of the code and is able to proceed with
      her tasks without a lot of help. Also communicate well with the team, bringing great energy into the
      teams she is working on, and she can quickly integrate. She knows exactly when to ask for help to
      speed up the delivery, and she is great at estimating how long something will take, which makes
      planning her task easy and smooth. Overall, it's a pleasure working with her.</blockquote><figcaption _ngcontent-ng-c203791225 class="author full-width"><strong _ngcontent-ng-c203791225>Peer</strong><span _ngcontent-ng-c203791225 class="author-details"><span _ngcontent-ng-c203791225>Frontend Developer</span><!----><span _ngcontent-ng-c203791225 aria-hidden="true">@</span><!----><span _ngcontent-ng-c203791225 class="company-info"><app-svg-icon _ngcontent-ng-c203791225 class="company-logo" _nghost-ng-c238518654 ngh="0"><img _ngcontent-ng-c238518654 alt loading="lazy" decoding="async" src="/assets/logos/ssc.svg"><!----><!----></app-svg-icon><span _ngcontent-ng-c203791225>SS&amp;C Technologies</span></span><!----><time _ngcontent-ng-c203791225 datetime="2026-02-01T00:00:00.000Z">(Feb 2026)</time><!----></span></figcaption></figure></app-review-card><app-review-card _ngcontent-ng-c782549083 _nghost-ng-c203791225 ngh="1"><figure _ngcontent-ng-c203791225 class="review-card"><blockquote _ngcontent-ng-c203791225 class="quote-full">Keep the desire and courage to try new technologies and also the will to learn new stuff. Clean
      code. Good eye for requirements. Fast learner even when switching projects. She is a reliable
      partner in the projects we are working together. Gives and receives feedback. Questions when
      facing something are not clear. Reliability on solving problems and unblocking others.</blockquote><figcaption _ngcontent-ng-c203791225 class="author full-width"><strong _ngcontent-ng-c203791225>Peer</strong><span _ngcontent-ng-c203791225 class="author-details"><span _ngcontent-ng-c203791225>Frontend Developer</span><!----><span _ngcontent-ng-c203791225 aria-hidden="true">@</span><!----><span _ngcontent-ng-c203791225 class="company-info"><app-svg-icon _ngcontent-ng-c203791225 class="company-logo" _nghost-ng-c238518654 ngh="0"><img _ngcontent-ng-c238518654 alt loading="lazy" decoding="async" src="/assets/logos/ssc.svg"><!----><!----></app-svg-icon><span _ngcontent-ng-c203791225>SS&amp;C Technologies</span></span><!----><time _ngcontent-ng-c203791225 datetime="2026-02-01T00:00:00.000Z">(Feb 2026)</time><!----></span></figcaption></figure></app-review-card><app-review-card _ngcontent-ng-c782549083 _nghost-ng-c203791225 ngh="1"><figure _ngcontent-ng-c203791225 class="review-card"><blockquote _ngcontent-ng-c203791225 class="quote-full">I promised to send you some feedback about the work we did together. I can only sum up positive
      things about how I experienced you in your job as frontend developer and unofficial screen
      designer:
      <ul><li>Eager to learn, you pick up new aspects of your job and gather the necessary information. It
      can be an international standard or a specific functionality of a tool, information you
      gathered so we could opt for different solutions to solve a problem in the front-end design
      or development.</li>
      <li>Focused: Your focus is always 100% on the job.</li>
      <li>Looking for smart solutions: Not only you help us with designing and developing screens for
      our end user, you also think with us to find the best suitable solution which is smart and
      user friendly and even you propose solutions we did not think of ourselves that meet the
      business requirements. This is more than we would expect from a front-end developer.</li>
      <li>Drive: you have a big drive to do your job as a professional with high quality standards and
      finding solutions for the end users.</li>
      <li>Hard worker: you do not do a 9 to 5 job; you just keep on picking up tasks and help us to
      realize a large set of requirements release after release. Your focus is always to deliver as
      much as possible, even if we come up with extra requirements just before releasing.</li>
      <li>Strong communication skills: you communicate very transparently, directly and to the
      point. This makes it easy to work together and not waste a lot of time discussing as we said
      before.</li></ul>
      It was a pleasure working with you. I wish you all the best.</blockquote><figcaption _ngcontent-ng-c203791225 class="author full-width"><strong _ngcontent-ng-c203791225>Kathleen Renard</strong><span _ngcontent-ng-c203791225 class="author-details"><span _ngcontent-ng-c203791225>Process Manager</span><!----><span _ngcontent-ng-c203791225 aria-hidden="true">@</span><!----><span _ngcontent-ng-c203791225 class="company-info"><app-svg-icon _ngcontent-ng-c203791225 class="company-logo" _nghost-ng-c238518654 ngh="0"><img _ngcontent-ng-c238518654 alt loading="lazy" decoding="async" src="/assets/logos/cognizant.svg"><!----><!----></app-svg-icon><span _ngcontent-ng-c203791225>Cognizant</span></span><!----><time _ngcontent-ng-c203791225 datetime="2024-11-01T00:00:00.000Z">(Nov 2024)</time><!----></span></figcaption></figure></app-review-card><app-review-card _ngcontent-ng-c782549083 _nghost-ng-c203791225 ngh="1"><figure _ngcontent-ng-c203791225 class="review-card"><blockquote _ngcontent-ng-c203791225 class="quote-full">You are my favorite developer. I don’t think you can further improve I’m not kidding, you are
      very quick in picking up new stories, you ask good questions so we as application manager can in
      fill in the blanks we haven’t thought about. The work is excellent as well. It’s a very difficult topic to
      work on; we have created a whole new application. You have taken a lot of initiative. There aren’t
      many bugs and the ones we have are quickly resolved. You are always thinking about finding good
      customer solutions, so I’m very happy with you. I can’t see any improvements that you can make.
      We are so happy with the way things are handled.</blockquote><figcaption _ngcontent-ng-c203791225 class="author full-width"><strong _ngcontent-ng-c203791225>Iris Vanstraelen</strong><span _ngcontent-ng-c203791225 class="author-details"><span _ngcontent-ng-c203791225>Application Manager</span><!----><span _ngcontent-ng-c203791225 aria-hidden="true">@</span><!----><span _ngcontent-ng-c203791225 class="company-info"><app-svg-icon _ngcontent-ng-c203791225 class="company-logo" _nghost-ng-c238518654 ngh="0"><img _ngcontent-ng-c238518654 alt loading="lazy" decoding="async" src="/assets/logos/cognizant.svg"><!----><!----></app-svg-icon><span _ngcontent-ng-c203791225>Cognizant</span></span><!----><time _ngcontent-ng-c203791225 datetime="2024-11-14T00:00:00.000Z">(Nov 2024)</time><!----></span></figcaption></figure></app-review-card><app-review-card _ngcontent-ng-c782549083 _nghost-ng-c203791225 ngh="1"><figure _ngcontent-ng-c203791225 class="review-card"><blockquote _ngcontent-ng-c203791225 class="quote-full">Here is some feedback about your involvement in our team. Overall, we are very happy with your
      contribution to our project and your role in the team. No real learning points could be found, which
      is very good . We appreciate: your ownership, your involvement, your E2E view, testing of your
      changes, the extra tasks you picked up outside of your role: UX design, use of new Kendo table
      component, you being open for feedback and improvements, how you take initiative, your efficient
      &amp; fast way of working, you to be a fast learner, how you take up a key position after replacing the old
      Tech Lead, you to think along with business about problems and solutions, you being a team
      player</blockquote><figcaption _ngcontent-ng-c203791225 class="author full-width"><strong _ngcontent-ng-c203791225>Etienne De Paepe</strong><span _ngcontent-ng-c203791225 class="author-details"><span _ngcontent-ng-c203791225>Manager</span><!----><span _ngcontent-ng-c203791225 aria-hidden="true">@</span><!----><span _ngcontent-ng-c203791225 class="company-info"><app-svg-icon _ngcontent-ng-c203791225 class="company-logo" _nghost-ng-c238518654 ngh="0"><img _ngcontent-ng-c238518654 alt loading="lazy" decoding="async" src="/assets/logos/cognizant.svg"><!----><!----></app-svg-icon><span _ngcontent-ng-c203791225>Cognizant</span></span><!----><time _ngcontent-ng-c203791225 datetime="2024-11-15T00:00:00.000Z">(Nov 2024)</time><!----></span></figcaption></figure></app-review-card><app-review-card _ngcontent-ng-c782549083 _nghost-ng-c203791225 ngh="1"><figure _ngcontent-ng-c203791225 class="review-card"><blockquote _ngcontent-ng-c203791225 class="quote-full">She proves her great technical expertise and collaboration skills with every task that is assigned to
      her and is supporting the project teams with business and technical information for successful
      integrations.</blockquote><figcaption _ngcontent-ng-c203791225 class="author full-width"><strong _ngcontent-ng-c203791225>Cristina-Mihaela Antohe</strong><span _ngcontent-ng-c203791225 class="author-details"><span _ngcontent-ng-c203791225>Senior Consultant</span><!----><span _ngcontent-ng-c203791225 aria-hidden="true">@</span><!----><span _ngcontent-ng-c203791225 class="company-info"><app-svg-icon _ngcontent-ng-c203791225 class="company-logo" _nghost-ng-c238518654 ngh="0"><img _ngcontent-ng-c238518654 alt loading="lazy" decoding="async" src="/assets/logos/deloitte.svg"><!----><!----></app-svg-icon><span _ngcontent-ng-c203791225>Deloitte Digital</span></span><!----><time _ngcontent-ng-c203791225 datetime="2022-11-07T00:00:00.000Z">(Nov 2022)</time><!----></span></figcaption></figure></app-review-card><app-review-card _ngcontent-ng-c782549083 _nghost-ng-c203791225 ngh="1"><figure _ngcontent-ng-c203791225 class="review-card"><blockquote _ngcontent-ng-c203791225 class="quote-full">Madalina is really valuable member, more of self-initiative in areas which are visibly not covered
      well on project will help her to present herself with higher seniority, she is currently operating at the
