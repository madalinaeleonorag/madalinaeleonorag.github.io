<figure class="review-card">
  <blockquote
    [class.quote-full]="fullReview()"
    [class.quote-preview]="!fullReview()"
    [innerHTML]="body()"
  ></blockquote>
  <figcaption class="author" [class.full-width]="fullReview()">
    <strong>{{ review().reviewer }}</strong>
    <span class="author-details">
      @if (showRole()) {
        <span>{{ review().position }}</span>
      }
      @if (showRole() && showCompany()) {
        <span aria-hidden="true">@</span>
      }
      @if (showCompany()) {
        <span class="company-info">
          <app-svg-icon [type]="review().company" class="company-logo" />
          <span>{{ review().company }}</span>
        </span>
      }
      @if (showRole() && showCompany()) {
        <time [attr.datetime]="review().date.toISOString()"
          >({{ review().date | date: 'MMM yyyy' }})</time
        >
      }
    </span>
  </figcaption>
</figure>
