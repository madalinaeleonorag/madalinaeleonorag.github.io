<header class="reviews-header">
  <div class="header-title">
    <p class="results-count">
      Showing {{ filteredReviews().length }} review{{
        filteredReviews().length !== 1 ? 's' : ''
      }}
      out of {{ ALL_REVIEWS.length }} total
    </p>
  </div>
</header>

<div class="filters-dashboard glass-card">
  <div class="filter-group">
    <p>Keyword Search</p>
    <lib-input
      type="text"
      placeholder="Search reviews..."
      [value]="searchTerm()"
      (valueChange)="searchTerm.set($event)"
    ></lib-input>
  </div>

  <div class="filter-group">
    <p>Domain / Category</p>
    <lib-select
      placeholder="All Domains"
      [options]="availableCategories()"
      [value]="selectedCategory()"
      (valueChange)="selectedCategory.set($event)"
    >
    </lib-select>
  </div>

  <div class="filter-group">
    <p>Company</p>
    <lib-select
      placeholder="All Companies"
      [options]="availableCompanies()"
      [value]="selectedCompany()"
      (valueChange)="selectedCompany.set($event)"
    >
    </lib-select>
  </div>

  <div class="filter-group">
    <p>From Date</p>
    <lib-input type="date" [value]="startDate()" (valueChange)="startDate.set($event)"></lib-input>
  </div>

  <div class="filter-group">
    <p>To Date</p>
    <lib-input type="date" [value]="endDate()" (valueChange)="endDate.set($event)"></lib-input>
  </div>
</div>

<div class="reviews-wrapper">
  @for (review of filteredReviews(); track $index) {
    <app-review-card
      [review]="review"
      [showRole]="true"
      [showCompany]="true"
      [fullReview]="true"
      [searchTerm]="searchTerm()"
    ></app-review-card>
  }
</div>
