<ul class="credentials-grid">
  @for (item of credentials; track item.id) {
    <li class="glass-card credential-card" [class.academic]="item.type === 'education'">
      <span class="logo-box">
        <img
          [src]="item.logo | assetPath"
          [alt]="item.issuer + ' logo'"
          appZoomable
          [zoomCaption]="item.title"
          loading="lazy"
          decoding="async"
        />
      </span>
      <p class="issuer-name">{{ item.issuer }}</p>
      <h3 class="credential-title">{{ item.title }}</h3>
      <div class="card-footer">
        <span>{{ item.date }}</span>
        @if (item.type === 'education') {
          <span>Grade: {{ item.grade }}</span>
        } @else if (item.url) {
          <a [href]="item.url" target="_blank" rel="noopener noreferrer">
            Verify<span class="visually-hidden"> the {{ item.title }} certificate</span> →
          </a>
        }
      </div>
    </li>
  }
</ul>
